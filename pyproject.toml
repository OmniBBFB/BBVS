[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbvs"
version = "0.1.0"
description = "A modular workbench for evaluating video understanding components"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
download = ["yt-dlp>=2025.1.0"]
asr-faster-whisper = ["faster-whisper>=1.1.0"]
asr-openai-whisper = ["openai-whisper>=20240930"]
ocr-rapidocr = ["rapidocr-onnxruntime>=1.4.0", "Pillow>=10.0"]
ocr-paddleocr = ["paddleocr>=3.0.0"]
dev = ["pytest>=8.0"]
report = ["weasyprint>=66.0"]
all = [
  "yt-dlp>=2025.1.0",
  "faster-whisper>=1.1.0",
  "openai-whisper>=20240930",
  "rapidocr-onnxruntime>=1.4.0",
  "Pillow>=10.0",
  "paddleocr>=3.0.0",
]

[project.scripts]
bbvs = "bbvs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bbvs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
