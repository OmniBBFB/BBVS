# DeepSeek 配置模板。复制为 pipeline-basic.yaml 后填写本地 API Key。
# config/pipeline-basic.yaml 已被 Git 忽略，可以保存本地凭据。
runs_dir: runs

retry:
  attempts: 3
  initial_delay: 2
  multiplier: 2
  max_delay: 30

services:
  llm:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    api_key: YOUR_DEEPSEEK_API_KEY
    timeout: 600

keyframes:
  threshold: 0.25
  max_frames: 500

ocr:
  engine: rapidocr
  language: ch

asr:
  engine: faster-whisper
  model: small
  device: auto
  compute_type: default
  language: null
  initial_prompt: null
  hotwords: null

analysis:
  verify: true
  vision: false
  summarize: true
  authoring: true

authoring:
  evidence_window_seconds: 120
  max_units_per_map: 4
  max_candidate_frames_per_request: 12
  selected_frames_per_request: 3

report:
  enabled: true
  filename: final-report.pdf
  include_transcript: true
  max_images: null
